name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run types:check
      - run: npm run format:check
      - run: npm run check:spell
      - run: npm run build
      # Routes and budgets share one server: starting `next start` twice would double the
      # slowest step in the job for no extra signal.
      - name: Check routes and budgets
        run: |
          set +e
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/en >/dev/null && break
            sleep 1
          done
          npm run check:routes
          ROUTES=$?
          npm run check:vitals
          VITALS=$?
          kill $SERVER_PID
          [ $ROUTES -eq 0 ] && [ $VITALS -eq 0 ]
        env:
          BASE_URL: http://localhost:3000

      # Last on purpose: this typechecks the docs samples against the package published to npm,
      # so it is legitimately red whenever a documented API is not released yet. Running it
      # earlier meant its failure skipped the build, the routes and the budgets behind it.
      - run: npm run check:samples
